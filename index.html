<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#c41e12" />
  <meta name="description" content="Vyrn — Show up. Put in the work. Equipment-free training + weekly challenges." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vyrn" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/favicon.png" sizes="32x32" />
  <link rel="icon" href="/assets/icon.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <title>Vyrn</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #262626;
      --text: #fafafa;
      --muted: #a3a3a3;
      --dim: #737373;
      --green: #ff3b2f;
      --accent: #ff6b35;
      --fire: #ff9f1c;
      --green-dim: #e6352a;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    #app { min-height: 100dvh; margin: 0 auto; position: relative; width: 100%; }
    html.mode-app #app { max-width: 480px; }
    html.mode-web #app { max-width: none; }

    /* —— Full-bleed browser website —— */
    html.mode-web body {
      background: #050505;
    }
    html.mode-web #app {
      max-width: none !important;
      width: 100%;
    }
    html.mode-web .site {
      width: 100%;
      max-width: none;
      padding: 0;
      margin: 0;
    }
    html.mode-web .site-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 48px;
      box-sizing: border-box;
    }
    html.mode-web .site-nav-wrap {
      width: 100%;
      border-bottom: 1px solid #1a1a1a;
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    html.mode-web .site-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      padding-left: 48px;
      padding-right: 48px;
    }
    html.mode-web .site-nav-logo {
      height: 44px;
      width: auto;
      border-radius: 10px;
    }
    html.mode-web .site-nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
      font-size: 15px;
    }
    html.mode-web .site-hero-wrap {
      width: 100%;
      background: radial-gradient(ellipse 80% 60% at 15% 50%, #4a120c 0%, #0a0505 55%, #050505 100%);
    }
    html.mode-web .site-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 64px;
      align-items: center;
      text-align: left;
      padding: 80px 48px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      background: none;
    }
    html.mode-web .site-hero-copy { order: 1; min-width: 0; }
    html.mode-web .site-hero-logo {
      order: 2;
      width: 100%;
      max-width: 480px;
      margin: 0 0 0 auto;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(255, 59, 47, 0.28);
    }
    html.mode-web .site-title {
      font-size: clamp(42px, 5.5vw, 64px);
      font-weight: 900;
      line-height: 1.02;
      margin-bottom: 20px;
      letter-spacing: -1.5px;
    }
    html.mode-web .site-hero-sub {
      margin: 0 0 32px;
      font-size: 18px;
      line-height: 1.55;
      max-width: 460px;
      color: #a3a3a3;
    }
    html.mode-web .site-hero-actions {
      justify-content: flex-start;
      gap: 14px;
    }
    html.mode-web .site-hero-actions .btn {
      width: auto;
      min-width: 160px;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
    }
    html.mode-web .site-section {
      padding: 72px 48px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    html.mode-web .site-section h2 {
      font-size: 36px;
      margin-bottom: 12px;
    }
    html.mode-web .site-lead {
      font-size: 17px;
      margin-bottom: 36px;
      max-width: 560px;
    }
    html.mode-web .site-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    html.mode-web .site-card {
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    html.mode-web .site-card:hover {
      transform: translateY(-4px);
      border-color: #ff3b2f44;
    }
    html.mode-web .site-card-visual { height: 200px; }
    html.mode-web .site-steps {
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    html.mode-web .site-cta-block {
      text-align: center;
      padding-bottom: 96px;
    }
    html.mode-web .site-cta-block .site-lead {
      margin-left: auto;
      margin-right: auto;
    }
    html.mode-web .site-footer {
      width: 100%;
      padding: 48px 48px 40px;
      border-top: 1px solid #1a1a1a;
      box-sizing: border-box;
    }
    @media (max-width: 900px) {
      html.mode-web .site-nav,
      html.mode-web .site-hero,
      html.mode-web .site-section {
        padding-left: 24px;
        padding-right: 24px;
      }
      html.mode-web .site-hero {
        grid-template-columns: 1fr;
        gap: 40px;
        text-align: center;
        padding-top: 48px;
        padding-bottom: 56px;
      }
      html.mode-web .site-hero-logo {
        margin: 0 auto;
        max-width: 360px;
        order: 0;
      }
      html.mode-web .site-hero-copy { order: 1; }
      html.mode-web .site-hero-sub { margin-left: auto; margin-right: auto; }
      html.mode-web .site-hero-actions { justify-content: center; }
      html.mode-web .site-grid,
      html.mode-web .site-steps { grid-template-columns: 1fr; }
    }

    html.mode-web body { background: #0a0a0a; }
    html.mode-app .tabbar { max-width: 480px; }
    .screen { padding: 20px 20px 100px; min-height: 100dvh; }
    .screen.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 40px; }
    .fade-in { animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .logo-big { font-size: 52px; font-weight: 900; letter-spacing: 8px; margin-bottom: 12px; }
    .logo-sm { font-size: 28px; font-weight: 900; letter-spacing: 5px; margin-bottom: 8px; }
    .pulse-soft { animation: pulseSoft 3s ease-in-out infinite; }
    @keyframes pulseSoft { 0%,100%{opacity:1} 50%{opacity:0.85} }
    .tagline { font-size: 18px; color: var(--muted); margin-bottom: 6px; }
    .muted { color: var(--muted); font-size: 14px; }
    h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .mb { margin-bottom: 16px; }
    .mt { margin-top: 16px; }
    .center { text-align: center; }
    .left { text-align: left; width: 100%; }
    .btn-stack { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 28px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; text-align: center; padding: 15px 20px;
      border-radius: 14px; font-size: 16px; font-weight: 700; border: none; cursor: pointer;
      font-family: inherit; transition: transform 0.12s, opacity 0.12s, background 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: var(--green); color: #000; }
    .btn.primary:hover { background: var(--green-dim); }
    .btn.secondary { background: transparent; color: var(--green); border: 1px solid var(--border); }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.hidden { display: none; }
    .btn.oauth { background: #1a1a1a; color: #fff; border: 1px solid var(--border); font-weight: 600; }
    .btn.oauth.google:hover { border-color: #4285f4; }
    .btn.oauth.apple:hover { border-color: #fff; }
    .oauth-ico {
      width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #000;
      display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;
    }
    .btn.oauth.apple .oauth-ico { background: #000; color: #fff; border: 1px solid #333; font-size: 16px; }
    .divider {
      display: flex; align-items: center; gap: 12px; width: 100%; max-width: 340px;
      margin: 20px 0; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    input {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; color: var(--text); font-size: 16px; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--green); }
    .msg { color: #f87171; font-size: 13px; margin-top: 12px; min-height: 20px; max-width: 320px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px; margin-bottom: 14px;
    }
    .card.tight { padding: 0; overflow: hidden; }
    .card.tight-pad { padding: 8px 14px; }
    .card.highlight { border-color: #ff3b2f55; background: linear-gradient(135deg, #141414, #1a0f0e); }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px 8px; }
    .stats { display: flex; gap: 10px; }
    .stat {
      flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; text-align: center;
    }
    .stat .num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat .lbl { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .timer-display {
      font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums;
      text-align: center; margin: 16px 0 8px; letter-spacing: -1px;
    }
    .timer-display.big { font-size: 64px; }
    .exercise-list { margin: 12px 0; width: 100%; }
    .ex-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 0;
      border-bottom: 1px solid var(--border); font-size: 15px;
    }
    .ex-item:last-child { border-bottom: none; }
    .ex-item .muted { margin-left: auto; }
    .lb-row {
      display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .lb-row:last-child { border-bottom: none; }
    .rank { width: 36px; color: var(--green); font-weight: 700; }
    .name { flex: 1; }
    .time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%; background: var(--green);
      color: #000; font-size: 28px; font-weight: 800; display: flex;
      align-items: center; justify-content: center; margin: 0 auto 10px;
    }
    .list-btn {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: none; border: none; color: var(--text); padding: 12px 0; cursor: pointer;
      font-family: inherit; border-bottom: 1px solid var(--border); font-size: 15px;
    }
    .list-btn:last-child { border-bottom: none; }
    .list-text { flex: 1; }
    .chev { color: var(--dim); font-size: 18px; }
    .ex-ico {
      width: 40px; height: 40px; border-radius: 12px; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .ex-ico-sm { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
    .hero-icon {
      font-size: 64px; text-align: center; margin: 8px 0 12px;
      filter: drop-shadow(0 8px 24px rgba(255,59,47,0.2));
    }
    .ex-stage {
      width: 120px; height: 120px; border-radius: 28px;
      background: radial-gradient(circle at 30% 30%, #2a1512, #141414);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin: 12px auto;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .ex-stage.work { border-color: #ff3b2f66; box-shadow: 0 0 32px rgba(255,59,47,0.15); }
    .ex-stage.rest { border-color: #3b82f666; }
    .ex-stage.done { border-color: #ff3b2f; }
    .ex-icon-lg { font-size: 52px; }
    .ex-icon-lg.bounce { animation: bounce 0.9s ease infinite; }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .pro-tag {
      display: inline-block; background: #ff3b2f22; color: var(--green);
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
      vertical-align: middle;
    }
    .badge {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      font-size: 11px; padding: 4px 10px; border-radius: 999px;
    }
    .badge.pro { color: var(--green); border-color: #ff3b2f44; }
    .section { font-size: 13px; color: var(--dim); text-transform: uppercase;
      letter-spacing: 0.5px; margin: 20px 0 8px; }
    .progress-bar {
      width: 100%; max-width: 280px; height: 6px; background: var(--border);
      border-radius: 3px; margin: 20px auto; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--green); transition: width 0.3s ease; border-radius: 3px; }
    .better { color: #ff3b2f; font-size: 12px; font-weight: 600; }
    .slower { color: #f59e0b; font-size: 12px; font-weight: 600; }
    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 15px;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle {
      border: 1px solid var(--border); background: #1a1a1a; color: var(--muted);
      border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; min-width: 52px;
    }
    .toggle.on { background: #3d1512; color: var(--green); border-color: #ff3b2f55; }
    .tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border); display: flex;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .tab {
      flex: 1; background: none; border: none; color: var(--dim);
      font-size: 12px; font-weight: 600; padding: 10px; cursor: pointer;
      font-family: inherit; transition: color 0.15s;
    }
    .tab.active { color: var(--green); }
    .legal-footer {
      text-align: center; padding: 24px 12px 120px; font-size: 12px; color: #525252;
    }
    .legal-footer a { color: #737373; text-decoration: none; margin: 0 6px; }

    .brand-logo {
      width: min(280px, 85vw); height: auto; border-radius: 16px;
      margin: 0 auto 16px; display: block;
      box-shadow: 0 12px 40px rgba(255,59,47,0.25);
    }
    .brand-logo-sm {
      width: 120px; height: auto; border-radius: 10px; margin: 0 auto 12px; display: block;
    }
    .icon-svg {
      width: 28px; height: 28px; color: #ff3b2f; display: block;
    }
    .icon-svg-lg {
      width: 64px; height: 64px; color: #ff6b35; display: block;
    }
    .icon-svg-sm {
      width: 22px; height: 22px; color: #ff6b35; flex-shrink: 0;
    }
    .ex-ico {
      background: linear-gradient(145deg, #1f1210, #140c0b) !important;
      border: 1px solid #3d2018;
    }
    .ex-stage {
      background: radial-gradient(circle at 30% 30%, #3d1810, #140c0b) !important;
    }

    /* —— Marketing website (browser) —— */
    .site { max-width: 960px; margin: 0 auto; padding: 0 20px 60px; }
    .site-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; position: sticky; top: 0; z-index: 20;
      background: rgba(10,10,10,0.9); backdrop-filter: blur(12px);
    }
    .site-nav-logo { height: 40px; width: auto; border-radius: 8px; }
    .site-nav-links { display: flex; gap: 16px; align-items: center; font-size: 14px; }
    .site-nav-links a { color: var(--muted); text-decoration: none; }
    .site-nav-links a:hover { color: #fff; }
    .site-cta {
      background: var(--green) !important; color: #000 !important;
      padding: 8px 14px; border-radius: 999px; font-weight: 700;
    }
    .site-hero {
      text-align: center; padding: 48px 0 64px;
      background: radial-gradient(ellipse at center, #3d1210 0%, transparent 65%);
    }
    .site-hero-logo {
      width: min(420px, 92vw); border-radius: 20px; margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(255,59,47,0.3);
    }
    .site-hero-sub {
      font-size: 18px; color: var(--muted); max-width: 480px; margin: 0 auto 28px; line-height: 1.5;
    }
    .site-hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .site-hero-actions .btn { width: auto; min-width: 160px; text-decoration: none; }
    .site-section { padding: 48px 0; }
    .site-section h2 { font-size: 28px; margin-bottom: 8px; }
    .site-lead { color: var(--muted); margin-bottom: 28px; max-width: 520px; }
    .site-grid {
      display: grid; grid-template-columns: 1fr; gap: 16px;
    }
    @media (min-width: 700px) {
      .site-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .site-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    }
    .site-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .site-card h3 { padding: 14px 16px 4px; font-size: 17px; }
    .site-card p { padding: 0 16px 16px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .site-steps { display: grid; gap: 12px; }
    @media (min-width: 700px) { .site-steps { grid-template-columns: repeat(3, 1fr); } }
    .site-steps > div {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    }
    .site-steps span {
      display: inline-flex; width: 28px; height: 28px; border-radius: 50%;
      background: var(--green); color: #000; font-weight: 800; align-items: center; justify-content: center;
      margin-bottom: 10px; font-size: 14px;
    }
    .site-cta-block { text-align: center; }
    .site-cta-block .btn { display: inline-flex; width: auto; min-width: 180px; text-decoration: none; margin: 8px auto; }
    .site-hint { font-size: 13px; color: var(--dim); margin-top: 12px; }
    .site-footer {
      text-align: center; padding: 40px 0 20px; border-top: 1px solid var(--border);
      color: #525252; font-size: 13px;
    }
    .site-footer-logo { height: 36px; border-radius: 6px; margin-bottom: 12px; opacity: 0.9; }
    .site-footer a { color: #737373; text-decoration: none; margin: 0 4px; }
    .site-credit { margin-top: 8px; font-size: 11px; color: #404040; }

    /* Photo thumbnails in app */
    .photo-thumb {
      width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .photo-hero {
      width: 100%; max-width: 320px; height: 160px; object-fit: cover; border-radius: 16px;
      margin: 8px auto 16px; display: block; border: 1px solid var(--border);
    }
    .photo-stage {
      width: 160px; height: 160px; border-radius: 24px; object-fit: cover;
      border: 2px solid #ff3b2f44;
    }


    /* Desktop website layout */
    html.mode-web .site { max-width: 1120px; margin: 0 auto; padding: 0 40px 80px; }
    html.mode-web .site-nav { padding: 20px 0; }
    html.mode-web .site-nav-logo { height: 48px; }
    html.mode-web .site-hero {
      display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center;
      text-align: left; padding: 72px 0 80px;
      background: radial-gradient(ellipse at 20% 40%, #4a1510 0%, transparent 55%);
    }
    html.mode-web .site-hero-logo {
      width: 100%; max-width: 520px; margin: 0;
      order: 2;
    }
    html.mode-web .site-hero-copy { order: 1; }
    html.mode-web .site-hero-sub { margin: 0 0 28px; font-size: 20px; max-width: 440px; }
    html.mode-web .site-hero-actions { justify-content: flex-start; }
    html.mode-web .site-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
    html.mode-web .site-card img { height: 200px; }
    html.mode-web .site-section h2 { font-size: 36px; }
    html.mode-web .site-steps { grid-template-columns: repeat(3, 1fr); gap: 20px; }
